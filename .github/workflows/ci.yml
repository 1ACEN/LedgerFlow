# LedgerFlow CI Pipeline
# Runs on every push and PR

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.11"

jobs:
  # =============================================================================
  # PYTHON: Lint, Typecheck, Test
  # =============================================================================
  python:
    name: Python (lint, typecheck, test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --dev

      - name: Lint (ruff)
        run: uv run ruff check scripts/ tests/

      - name: Format check (ruff)
        run: uv run ruff format --check scripts/ tests/

      - name: Typecheck (mypy)
        run: uv run mypy scripts/db/ scripts/ingestion/ scripts/ml/ scripts/utils/

      - name: Generate test data
        run: uv run python scripts/utils/generate_synthetic.py --rows 5000 --output data/ledgerflow.duckdb

      - name: Unit tests (pytest)
        run: uv run pytest tests/unit -v --tb=short
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY_TEST }}
          PLAID_CLIENT_ID: ${{ secrets.PLAID_CLIENT_ID_TEST }}
          PLAID_SECRET: ${{ secrets.PLAID_SECRET_TEST }}

  # =============================================================================
  # SECURITY: Scan
  # =============================================================================
  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "table"
          exit-code: "0"

      - name: Check for secrets (truffleHog)
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.before || github.sha }}
          head: ${{ github.sha }}
          extra_args: --only-verified