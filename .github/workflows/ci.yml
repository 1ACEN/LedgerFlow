# LedgerFlow CI Pipeline
# Runs on every push and PR

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  # =============================================================================
  # PYTHON: Lint, Typecheck, Test
  # =============================================================================
  python:
    name: Python (lint, typecheck, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./LedgerFlow
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --dev

      - name: Lint (ruff)
        run: make lint-python

      - name: Typecheck (mypy)
        run: make typecheck-python

      - name: SQL Lint (sqlfluff)
        run: make lint-sql

      - name: Unit tests (pytest)
        run: make test-python
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY_TEST }}
          PLAID_CLIENT_ID: ${{ secrets.PLAID_CLIENT_ID_TEST }}
          PLAID_SECRET: ${{ secrets.PLAID_SECRET_TEST }}

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: python

  # =============================================================================
  # JAVASCRIPT: Lint, Typecheck, Test
  # =============================================================================
  javascript:
    name: JavaScript (lint, typecheck, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./LedgerFlow/evidence
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: "evidence/package.json"

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Typecheck (TypeScript)
        run: npm run typecheck

      - name: Test (Vitest)
        run: npm test

      - name: Build Evidence.dev
        run: npm run build

  # =============================================================================
  # DOCKER: Build image
  # =============================================================================
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [python, javascript]
    defaults:
      run:
        working-directory: ./LedgerFlow
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: false
          tags: ledgerflow:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test image runs
        run: |
          docker run --rm -d --name ledgerflow-test \
            -e GENERATE_SYNTHETIC=true \
            -e DUCKDB_PATH=/data/test.duckdb \
            -p 3000:3000 \
            ledgerflow:ci
          sleep 15
          curl -f http://localhost:3000/health
          docker stop ledgerflow-test

  # =============================================================================
  # INTEGRATION: Full pipeline test
  # =============================================================================
  integration:
    name: Integration test
    runs-on: ubuntu-latest
    needs: [python, javascript]
    defaults:
      run:
        working-directory: ./LedgerFlow
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --dev

      - name: Generate synthetic data
        run: make generate-data

      - name: Train models
        run: make train

      - name: Run predictions
        run: python scripts/predict_cashflow.py --db data/ledgerflow.duckdb --model models/cash_forecast.joblib

      - name: Run reconciliation
        run: python scripts/reconcile.py --db data/ledgerflow.duckdb

      - name: Verify dashboard builds
        run: |
          cd evidence
          npm ci
          npm run build

  # =============================================================================
  # SECURITY: Scan
  # =============================================================================
  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: "trivy-results.sarif"

      - name: Check for secrets (truffleHog)
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: main
          head: HEAD