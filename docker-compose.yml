services:
  # LedgerFlow application container
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: runtime
    container_name: ledgerflow-app
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://ledgerflow:ledgerflow@postgres:5432/ledgerflow}
      - MODEL_REGISTRY_PATH=/models/
      - GENERATE_SYNTHETIC=true
      - DEMO_MODE=${DEMO_MODE:-true}
      - DEMO_INTERVAL_SEC=${DEMO_INTERVAL_SEC:-4}
      - LOG_LEVEL=INFO
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - PLAID_CLIENT_ID=${PLAID_CLIENT_ID:-}
      - PLAID_SECRET=${PLAID_SECRET:-}
      - PLAID_ENV=${PLAID_ENV:-sandbox}
      - PLAID_ACCESS_TOKENS=${PLAID_ACCESS_TOKENS:-}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ledgerflow_models:/models
      - ./scripts:/app/scripts:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # Local/Container PostgreSQL 16 (exposed on 5433 to avoid conflict with local Postgres on 5432)
  postgres:
    image: postgres:16-alpine
    container_name: ledgerflow-postgres
    environment:
      POSTGRES_DB: ledgerflow
      POSTGRES_USER: ledgerflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ledgerflow}
    ports:
      - "5433:5432"
    volumes:
      - ledgerflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgerflow -d ledgerflow"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ledgerflow_models:
  ledgerflow_pgdata: