version: '3.8'

services:
  # LedgerFlow application container
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: runtime
    container_name: ledgerflow-app
    ports:
      - "3000:3000"
    environment:
      - DUCKDB_PATH=/data/ledgerflow.duckdb
      - MODEL_REGISTRY_PATH=/models/
      - GENERATE_SYNTHETIC=true
      - LOG_LEVEL=INFO
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - PLAID_CLIENT_ID=${PLAID_CLIENT_ID:-}
      - PLAID_SECRET=${PLAID_SECRET:-}
      - PLAID_ENV=${PLAID_ENV:-sandbox}
      - PLAID_ACCESS_TOKENS=${PLAID_ACCESS_TOKENS:-}
    volumes:
      - ledgerflow_data:/data
      - ledgerflow_models:/models
      - ./evidence:/app/evidence:ro  # Mount for hot reload in dev
      - ./scripts:/app/scripts:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # Optional: PostgreSQL for production-like testing
